name: Daily 6PM LacrosseTube Curator

on:
  schedule:
    # GitHub cron is UTC. 23:00 UTC is 6:00pm Eastern Standard Time and 7:00pm during daylight time.
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  curate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run the daily curator
        run: python3 daily_6pm_curator.py

      - name: Commit shelf updates
        run: |
          git config user.name "LacrosseTube 6PM Bot"
          git config user.email "bot@lacrossetube.local"
          git add data/ blog/
          git diff --staged --quiet || git commit -m "chore(6pm-curator): daily lacrosse shelf harvest"
          git push
