name: Local feature checks
on:
  push:
    paths: ['js/**', 'tests/**', 'scripts/research_digest.py', '.github/workflows/checks.yml']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: node --test tests/local-features.test.cjs
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
